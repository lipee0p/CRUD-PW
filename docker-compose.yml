version: '3.8'

services:
  # Servidor Web com PHP e Apache
  web:
    build: .
    container_name: style_barber_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_DATABASE=style_barber
      - DB_USERNAME=style_user
      - DB_PASSWORD=style_pass
    depends_on:
      - db

  # Banco de Dados MySQL
  db:
    image: mysql:8.0
    container_name: style_barber_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=style_barber
      - MYSQL_USER=style_user
      - MYSQL_PASSWORD=style_pass
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - mysql_data:/var/lib/mysql

  # phpMyAdmin (Adicione este bloco aqui embaixo!)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: style_barber_phpmyadmin
    ports:
      - "8000:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

volumes:
  mysql_data: