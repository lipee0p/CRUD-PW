version: '3.8'

services:
  # Servidor Web com PHP e Apache
  web:
    build: .
    container_name: style_barber_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_DATABASE=style_barber
      - DB_USERNAME=style_user
      - DB_PASSWORD=style_pass
    depends_on:
      - db

  # Banco de Dados MySQL
  db:
    image: mysql:8.0
    container_name: style_barber_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=style_barber
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      # Cria as tabelas automaticamente na primeira inicialização usando o arquivo init.sql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      # Volume persistente para os dados do MySQL
      - mysql_data:/var/lib/mysql
    # Mantém o plugin de autenticação nativo para compatibilidade com drivers PHP mais antigos
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
